name: apna_fashion_mart
description: Hyperlocal fashion marketplace — discover boutiques near you.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  jwt_decoder: ^2.0.1
  go_router: ^13.2.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cached_network_image: ^3.3.1
  razorpay_flutter: ^1.3.6
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  google_maps_flutter: ^2.6.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  dio: ^5.6.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  # firebase_core: ^3.3.0        # re-enable once google-services.json is added
  # firebase_messaging: ^15.0.4   # re-enable once google-services.json is added
  flutter_local_notifications: ^17.2.2
  badges: ^3.1.2
  fl_chart: ^0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
